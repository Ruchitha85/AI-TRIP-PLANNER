<!DOCTYPE html>
<html>

<head>

    <title>AI Trip Planner</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>AI Trip Planner</h1>

        <form id="tripForm">

            <input type="text"
                   id="destination"
                   placeholder="Enter Destination"
                   required>
                   
            <input type="number"
                   id="budget"
                   placeholder="Enter Budget"
                   required>

            <input type="number"
                   id="days"
                   placeholder="Number of Days"
                   required>

            <select id="interest">

                <option>Adventure</option>
                <option>Food</option>
                <option>Nature</option>
                <option>Shopping</option>

            </select>

            <button type="submit">
                Generate Trip
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>
    <p style="text-align:center;">
        Developed by Ruchitha
    </p>"

</body>

</html>
